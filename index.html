<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="description" content="リーグ戦の対戦表・総当たりの組み合わせ・順位表を作れるツール">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リーグ戦 対戦表（6チーム）</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#2b2a28; --sub:#77726a; --line:#ddd7cc;
    --head:#efe9de; --diag:#cfc8bb;
    --win:#e4572e; --winbg:#fde6de;
    --draw:#c99a06; --drawbg:#fdf3cf;
    --lose:#2f6fb5; --losebg:#dde9f7;
    --accent:#2f7d5b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  header{padding:18px 16px 6px;max-width:980px;margin:0 auto}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em}
  #title{border:none;background:transparent;font:inherit;color:inherit;width:100%;padding:2px 0;border-bottom:2px dashed transparent}
  #title:focus{outline:none;border-bottom-color:var(--line)}
  .hint{color:var(--sub);font-size:13px;margin:6px 0 0}
  main{max-width:980px;margin:0 auto;padding:8px 12px 40px}
  section{background:var(--card);border-radius:14px;padding:14px 12px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--accent)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:separate;border-spacing:0;width:100%}
  #grid{min-width:560px;table-layout:fixed}
  #grid th,#grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
  #grid tr:first-child th{border-top:1px solid var(--line)}
  #grid th:first-child,#grid td:first-child{border-left:1px solid var(--line)}
  #grid th{background:var(--head);font-size:13px;padding:8px 4px;font-weight:700;word-break:break-all}
  #grid th.corner{background:#e6dfd1;font-size:11px;color:var(--sub);position:sticky;left:0;z-index:2}
  #grid th.rowh{position:sticky;left:0;z-index:1;width:96px}
  #grid col.namecol{width:96px}
  td.cell{height:64px;padding:2px;cursor:pointer;transition:background .15s}
  td.cell:hover{background:#faf8f3}
  td.cell .mark{font-size:24px;font-weight:800;line-height:1.1}
  td.cell .score{font-size:12px;color:var(--sub);margin-top:2px;letter-spacing:.03em}
  td.cell.empty .mark{color:#d4cec3;font-size:18px}
  td.win{background:var(--winbg)} td.win .mark{color:var(--win)}
  td.draw{background:var(--drawbg)} td.draw .mark{color:var(--draw)}
  td.lose{background:var(--losebg)} td.lose .mark{color:var(--lose)}
  td.diag{background:repeating-linear-gradient(135deg,var(--diag) 0 2px,#e9e4da 2px 9px)}
  #standings{min-width:520px}
  #standings th,#standings td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
  #standings th{background:var(--head);font-size:12px;color:#55514b}
  #standings td.name{text-align:left;font-weight:700}
  #standings td.pts{font-weight:800;color:var(--accent);font-size:16px}
  .rank{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;background:#eee}
  .r1{background:#f4c542;color:#5a4300}.r2{background:#d5d9de;color:#3b4148}.r3{background:#e3b08a;color:#5b3218}
  .tools{display:flex;flex-wrap:wrap;gap:8px}
  .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
  .teams label{font-size:11px;color:var(--sub)}
  input[type=text],input[type=number]{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent)}
  .pt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
  .pt input{width:64px;text-align:center}
  button{font:inherit;font-weight:700;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px}
  .btn{background:var(--head);color:var(--ink)}
  .btn.danger{background:#f6dcd6;color:#a23b22}
  .btn.primary{background:var(--accent);color:#fff}
  /* dialog */
  .overlay{position:fixed;inset:0;background:rgba(30,28,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
  @media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin-bottom:14px}
  .vs .tn{font-weight:800;font-size:17px;word-break:break-all}
  .vs .x{color:var(--sub);font-size:13px}
  .scorebox{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:14px}
  .scorebox input{text-align:center;font-size:28px;font-weight:800;padding:10px 4px}
  .scorebox .dash{font-size:24px;font-weight:800;color:var(--sub)}
  .marks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .marks button{font-size:30px;padding:10px 0;background:#f3f1ec;border:2.5px solid transparent}
  .marks button[data-m="○"].on{background:var(--winbg);border-color:var(--win);color:var(--win)}
  .marks button[data-m="△"].on{background:var(--drawbg);border-color:var(--draw);color:var(--draw)}
  .marks button[data-m="✖︎"].on{background:var(--losebg);border-color:var(--lose);color:var(--lose)}
  .marks small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
  .note{font-size:12px;color:var(--sub);margin:4px 0 14px;min-height:16px}
  .row{display:flex;gap:8px}
  .row button{flex:1}
  .confirm .sheet p{margin:0 0 16px;line-height:1.7}
  .bar{display:flex;align-items:center;gap:8px;margin-top:8px}
  .status{font-size:12px;color:var(--accent)}
  .status.err{color:#a23b22}
  .btn.small{padding:5px 10px;font-size:12px}
  .lbl{font-size:11px;color:var(--sub);display:block}
  button:disabled{opacity:.5}
  .count{font-size:12px;font-weight:500;color:var(--sub);margin-left:auto}
  .rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .round{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fcfbf8}
  .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
  .rest{font-size:12px;color:var(--sub);background:#eee9df;border-radius:999px;padding:2px 10px}
  .game{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 8px;margin-top:6px;font-weight:700;font-size:14px;color:var(--ink)}
  .game:first-of-type{margin-top:0}
  .game.done{border-color:#bcd9ca;background:#f3faf6}
  .game .gt{word-break:break-all}
  .game .gt:first-child{text-align:right}
  .game .gt:last-child{text-align:left}
  .game .gt i{font-style:normal;font-weight:800;margin:0 4px}
  .game .gt.win i{color:var(--win)} .game .gt.draw i{color:var(--draw)} .game .gt.lose i{color:var(--lose)}
  .game .gs{font-size:13px;color:var(--sub);min-width:52px;text-align:center;background:#f3f1ec;border-radius:8px;padding:3px 6px}
  .game.done .gs{color:var(--ink);background:#e2f1e8}
  .counter{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
  .counter .btn{width:44px;height:44px;padding:0;font-size:20px}
  #nView,.cnum{font-size:24px;font-weight:800;min-width:32px;text-align:center}
  .counter .unit{font-size:13px;color:var(--sub);margin-left:-6px}
  .note.warn{color:#a23b22}
  /* 組み合わせ表（コート×試合番号） */
  #sched{border-collapse:separate;border-spacing:6px;width:100%}
  #sched th{font-size:15px;font-weight:800;color:#3d3a35;padding:6px 4px;background:var(--head);border-radius:10px}
  #sched th.noh{background:transparent;width:72px}
  #sched td{padding:0}
  .slotno{min-width:64px;height:40px;padding:0 10px;white-space:nowrap;border-radius:999px;border:2.5px solid #3d3a35;background:#fff;font:inherit;font-size:15px;font-weight:800;color:#3d3a35;display:flex;align-items:center;justify-content:center;margin:0 auto;padding:0;cursor:pointer}
  tr.now .slotno{background:#f4b400;border-color:#f4b400;color:#fff;box-shadow:0 0 0 4px #fde7a6}
  tr.over .slotno{background:#e9e5dc;border-color:#bdb6a8;color:#8a8478}
  .match{width:100%;min-height:62px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .match .vsline{font-size:19px;font-weight:800;letter-spacing:.02em}
  .match .names{font-size:11px;color:var(--sub);word-break:break-all;line-height:1.3}
  .match .res{font-size:12px;font-weight:700}
  .match .res .w{color:var(--win)} .match .res .d{color:var(--draw)} .match .res .l{color:var(--lose)}
  tr.now .match{background:#fff8df;border-color:#f4b400;border-width:2.5px}
  .match.done{background:#f1f7f3;border-color:#bcd9ca}
  tr.now .match.done{background:#eef6e9}
  .nogame{color:#c9c2b5;text-align:center;font-size:13px}
  .restline{font-size:12px;color:var(--sub);text-align:left;padding:0 4px 4px 4px}
  /* 得点板 */
  #boardOld{position:fixed;inset:0;background:#15171c;color:#fff;z-index:60;display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
  #board.open{display:flex}
  .btop{display:flex;align-items:center;gap:8px}
  .btop .bt{flex:1;font-size:14px;color:#aab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bbtn{background:#2a2e37;color:#fff;border:none;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .bbtn.go{background:#2f9e6a}.bbtn.warn{background:#b8452a}.bbtn.y{background:#e0a400;color:#222}
  .timer{text-align:center;margin:8px 0 4px}
  #tDisp{font-size:clamp(56px,14vw,140px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1}
  #tDisp.low{color:#ff6b5a}
  #tDisp.end{color:#ff6b5a;animation:blink .6s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  .tctl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .tset{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px;font-size:13px;color:#aab}
  .tset input{width:64px;background:#2a2e37;border:1px solid #3a3f4a;color:#fff;text-align:center;padding:6px;border-radius:8px;font:inherit;font-size:16px}
  .sides{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;min-height:0}
  .side{border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 8px;user-select:none;-webkit-user-select:none;min-height:0}
  .side.l{background:#c0392b}.side.r{background:#2563a8}
  .side .tname{font-size:clamp(18px,4vw,34px);font-weight:800;text-align:center;word-break:break-all}
  .side .pts{flex:1;width:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,24vw,260px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;cursor:pointer}
  .side .pm{display:flex;gap:10px;width:100%}
  .side .pm button{flex:1;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:12px;padding:12px 0;font:inherit;font-size:22px;font-weight:800;cursor:pointer}
  .bfoot{display:flex;gap:8px;margin-top:10px}
  .bfoot .bbtn{flex:1;padding:14px}
  .bnote{text-align:center;color:#aab;font-size:12px;min-height:16px;margin-top:6px}
  .freebtn{margin-left:auto}
  .cnum{font-size:24px;font-weight:800;min-width:32px;text-align:center}
  /* タブ */
  .tabs{position:sticky;top:0;z-index:40;background:var(--bg);display:flex;gap:6px;padding:8px 12px;max-width:980px;margin:0 auto;overflow-x:auto}
  .tabs button{flex:1;min-width:84px;background:#fff;border:1.5px solid var(--line);color:var(--sub);border-radius:12px;padding:10px 6px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pane{display:none}.pane.on{display:block}
  .darkpane{background:#15171c;color:#fff;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;min-height:calc(100vh - 150px);min-height:calc(100dvh - 150px)}
  .pane.on.dark{display:block;max-width:980px;margin:0 auto;padding:4px 12px 16px}
  .selrow{margin-top:4px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
  .selrow select{width:100%;font:inherit;font-size:16px;font-weight:700;padding:9px 8px;border-radius:10px;border:1px solid #3a3f4a;background:#2a2e37;color:#fff}
  .selrow .vsm{color:#aab;font-size:13px}
  .presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .presets button{background:#2a2e37;color:#fff;border:none;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  #timerBox{margin:0 0 10px}
  #timerBox #tDisp{font-size:clamp(64px,17vw,170px)}
  #timerBox .tctl{align-items:center}
  #timerBox .tset{margin:0}
  #timerBox .presets{margin-top:8px}
  #timerBox .presets button{padding:6px 12px;font-size:13px}
  body.darkmode main{display:none}
  body.darkmode header .hint{display:none}
  body.darkmode header{padding-bottom:0}
  body.darkmode .darkpane{min-height:calc(100vh - 130px);min-height:calc(100dvh - 130px)}
  header{position:relative;padding-right:60px}
  .logo{position:absolute;top:12px;right:14px;width:44px;height:auto}
  body.darkmode .logo{width:34px;top:10px}
  @media(min-width:700px){header{padding-right:80px}.logo{width:60px}}
</style>
</head>

<script>
const INV = {"○":"✖︎","✖︎":"○","△":"△"};
const KEY="league-taisenhyo-v3", OLDKEY="league-taisenhyo-v2", MIN_T=2, MAX_T=12, MIN_C=1, MAX_C=6;
const COURT = "ABCDEF";
const MARU = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵㊶㊷㊸㊹㊺㊻㊼㊽㊾㊿";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (a,b) => (a===""||a==null||b===""||b==null) ? "" : `${a}-${b}`;
const cls = m => !m ? "empty" : m==="○"?"win":m==="△"?"draw":"lose";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- 保存データ ---------- */
function defaultStore(){ return {title:"リーグ戦 対戦表", n:6, courts:3, minutes:5, allTeams:Array.from({length:MAX_T},(_,i)=>`チーム${i+1}`), pts:{win:3,draw:1,lose:0}, res:{}, cur:null}; }
let store = defaultStore();
try{
  const s=JSON.parse(localStorage.getItem(KEY)) || JSON.parse(localStorage.getItem(OLDKEY));
  if(s&&Array.isArray(s.allTeams)) store=Object.assign(defaultStore(),s);
}catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ setStatus("このブラウザでは保存できません。書き出しで保存してください。", true); } }
function setStatus(t, err){ const el=$("status"); el.textContent=t; el.className = err ? "status err" : "status"; }
const N = ()=>clamp(Number(store.n)||6,MIN_T,MAX_T);
const C = ()=>clamp(Number(store.courts)||1,MIN_C,MAX_C);
const teams = ()=>store.allTeams.slice(0,N());

function get(i,j){
  const k = i<j ? `${i}-${j}` : `${j}-${i}`, r = store.res[k];
  if(!r) return null;
  if(i<j) return {my:r.a, op:r.b, m:r.m};
  return {my:r.b, op:r.a, m:r.m ? INV[r.m] : ""};
}
function put(i,j,my,op,m){
  const a=Math.min(i,j), b=Math.max(i,j), k=`${a}-${b}`;
  if(!m) delete store.res[k];
  else store.res[k] = i<j ? {a:String(my),b:String(op),m} : {a:String(op),b:String(my),m:INV[m]};
  persist();
}

/* ---------- 組み合わせ（コートに割り振り） ---------- */
function circle(n){
  const arr=[...Array(n).keys()]; if(n%2) arr.push(-1);
  const m=arr.length, rounds=[];
  for(let r=0;r<m-1;r++){
    const g=[];
    for(let k=0;k<m/2;k++) g.push([arr[k],arr[m-1-k]]);
    rounds.push(g); arr.splice(1,0,arr.pop());
  }
  // 1回目が 1-2, 3-4, 5-6… になるように番号をつけかえる
  const map={}; let next=0, rest=null;
  rounds[0].forEach(([x,y])=>{ if(x===-1||y===-1){ rest = x===-1?y:x; } else { map[x]=next++; map[y]=next++; } });
  if(rest!==null) map[rest]=next++;
  return rounds.map(g=>g.filter(([x,y])=>x!==-1&&y!==-1).map(([x,y])=>{const a=map[x],b=map[y];return [Math.min(a,b),Math.max(a,b)];}));
}
function makeSchedule(n,C){
  const order=circle(n).flat();
  const build=(byRest)=>{
    let rem=order.slice(), slots=[], last=Array(n).fill(-99);
    while(rem.length){
      const s=slots.length, used=new Set(), games=[];
      const cand = byRest ? rem.map((g,idx)=>({g,idx})).sort((p,q)=>(Math.max(last[p.g[0]],last[p.g[1]])-Math.max(last[q.g[0]],last[q.g[1]]))||(p.idx-q.idx)) : rem.map((g,idx)=>({g,idx}));
      for(const {g} of cand){ if(games.length>=C) break; if(used.has(g[0])||used.has(g[1])) continue; games.push(g); used.add(g[0]); used.add(g[1]); }
      games.forEach(g=>{ last[g[0]]=s; last[g[1]]=s; rem.splice(rem.indexOf(g),1); });
      const rest=[...Array(n).keys()].filter(t=>!used.has(t));
      slots.push({games,rest});
    }
    return slots;
  };
  const a=build(false), b=build(true);
  return b.length<=a.length ? b : a;
}

let schedCache={key:"",val:null};
function schedule(){
  const key=N()+"-"+C();
  if(schedCache.key!==key) schedCache={key,val:makeSchedule(N(),C())};
  return schedCache.val;
}

/* ---------- 表示 ---------- */
function renderSched(){
  const S=schedule(), T=teams(), c=Math.min(C(), Math.floor(N()/2));
  let done=0, total=N()*(N()-1)/2;
  let h=`<tr><th class="noh"></th>`;
  for(let k=0;k<c;k++) h+=`<th>${COURT[k]}コート</th>`;
  h+=`</tr>`;
  S.forEach((slot,s)=>{
    const over = slot.games.every(([a,b])=>{const r=get(a,b); return r&&r.m;});
    const rowCls = store.cur===s ? "now" : (over?"over":"");
    h+=`<tr class="${rowCls}"><td><button class="slotno" data-slot="${s}" >${s+1}回戦</button></td>`;
    for(let k=0;k<c;k++){
      const g=slot.games[k];
      if(!g){ h+=`<td class="nogame">－</td>`; continue; }
      const [a,b]=g, r=get(a,b), ok=r&&r.m; if(ok) done++;
      const res = ok ? `<div class="res"><span class="${cls(r.m).charAt(0)}">${r.m}</span> ${esc(fmt(r.my,r.op)||"")} <span class="${cls(INV[r.m]).charAt(0)}">${INV[r.m]}</span></div>` : "";
      h+=`<td><button class="match ${ok?"done":""}" data-i="${a}" data-j="${b}" data-slot="${s}">
            <span class="vsline">${a+1} - ${b+1}</span>
            <span class="names">${esc(T[a])}・${esc(T[b])}</span>${res}</button></td>`;
    }
    h+=`</tr>`;
    if(slot.rest.length) h+=`<tr class="${rowCls}"><td></td><td colspan="${c}" class="restline">休み：${slot.rest.map(t=>esc(T[t])).join("、")}</td></tr>`;
  });
  $("sched").innerHTML=h;
  $("progress").textContent=`${done} / ${total} 試合おわり`;
}
function renderGrid(){
  const n=N(), T=teams();
  $("grid").style.minWidth = (96 + n*80) + "px";
  let h = `<colgroup><col class="namecol">${'<col>'.repeat(n)}</colgroup><tr><th class="corner">チーム名</th>`;
  T.forEach(t=> h += `<th>${esc(t)}</th>`);
  h += "</tr>";
  for(let i=0;i<n;i++){
    h += `<tr><th class="rowh">${esc(T[i])}</th>`;
    for(let j=0;j<n;j++){
      if(i===j){ h += `<td class="diag"></td>`; continue; }
      const r = get(i,j);
      h += `<td class="cell ${cls(r&&r.m)}" data-i="${i}" data-j="${j}"><div class="mark">${r&&r.m?r.m:"・"}</div><div class="score">${r?fmt(r.my,r.op):""}</div></td>`;
    }
    h += "</tr>";
  }
  $("grid").innerHTML = h;
}
function stats(){
  const P=store.pts, n=N();
  const rows = teams().map((name,i)=>{
    let w=0,d=0,l=0,gf=0,ga=0,played=0;
    for(let j=0;j<n;j++){ if(i===j) continue; const r=get(i,j); if(!r) continue;
      if(r.m==="○")w++; else if(r.m==="△")d++; else if(r.m==="✖︎")l++;
      if(r.m) played++;
      const a=Number(r.my), b=Number(r.op);
      if(r.my!==""&&r.op!==""&&!isNaN(a)&&!isNaN(b)){ gf+=a; ga+=b; }
    }
    return {i,name,w,d,l,gf,ga,diff:gf-ga,played,pts:w*P.win+d*P.draw+l*P.lose};
  });
  const sorted=[...rows].sort((x,y)=>y.pts-x.pts||y.diff-x.diff||y.gf-x.gf||x.i-y.i);
  sorted.forEach((r,k)=>{ const p=sorted[k-1]; r.rank=(p&&p.pts===r.pts&&p.diff===r.diff&&p.gf===r.gf)?p.rank:k+1; });
  return sorted;
}
function renderStandings(){
  let h = `<tr><th>順位</th><th style="text-align:left">チーム</th><th>試合</th><th>勝</th><th>分</th><th>負</th><th>得点</th><th>失点</th><th>差</th><th>勝点</th></tr>`;
  stats().forEach(r=>{
    h += `<tr><td><span class="rank ${r.rank<=3?'r'+r.rank:''}">${r.rank}</span></td><td class="name">${esc(r.name)}</td><td>${r.played}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.diff>0?'+':''}${r.diff}</td><td class="pts">${r.pts}</td></tr>`;
  });
  $("standings").innerHTML = h;
}
function renderAll(){
  $("titleView").textContent=store.title; document.title=store.title;
  renderSched(); renderGrid(); renderStandings();
}

/* ---------- いまの試合（①②…） ---------- */
$("sched").addEventListener("click",e=>{
  const no=e.target.closest(".slotno");
  if(no){ const s=+no.dataset.slot; store.cur = store.cur===s ? null : s; persist(); renderSched(); return; }
  const m=e.target.closest(".match");
  if(m) openDlg(+m.dataset.i, +m.dataset.j);
});

/* ---------- 結果入力ダイアログ（対戦表のマス） ---------- */
let cur=null, mark="", manual=false;
const dlg=$("dlg"), sA=$("sA"), sB=$("sB"), dNote=$("dNote");
function setMark(m){ mark=m; document.querySelectorAll("#marks button").forEach(b=>b.classList.toggle("on",b.dataset.m===m)); }
function autoMark(){
  if(manual) return;
  const a=sA.value, b=sB.value; if(a===""||b==="") return;
  setMark(+a>+b?"○":+a<+b?"✖︎":"△");
  dNote.textContent="得点から自動で選びました（タップで変えられます）";
}
function openDlg(i,j){
  cur={i,j}; const r=get(i,j), T=teams();
  $("dA").textContent=T[i]; $("dB").textContent=T[j];
  sA.value=r?r.my:""; sB.value=r?r.op:"";
  manual=!!(r&&r.m); setMark(r?r.m:""); dNote.textContent="";
  dlg.classList.add("open");
}
function closeDlg(){ dlg.classList.remove("open"); cur=null; renderAll(); }
$("grid").addEventListener("click",e=>{ const t=e.target.closest("td.cell"); if(t) openDlg(+t.dataset.i,+t.dataset.j); });
$("marks").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  manual=true; setMark(mark===b.dataset.m?"":b.dataset.m); dNote.textContent="";
});
sA.addEventListener("input",autoMark); sB.addEventListener("input",autoMark);
$("dSave").onclick=()=>{
  if(!mark && sA.value===""&&sB.value===""){ put(cur.i,cur.j,"","",""); closeDlg(); return; }
  if(!mark){ dNote.textContent="○・△・✖︎ のどれかを選んでください"; return; }
  put(cur.i,cur.j,sA.value,sB.value,mark); closeDlg();
};
$("dClear").onclick=()=>{ put(cur.i,cur.j,"","",""); closeDlg(); };
$("dCancel").onclick=closeDlg;
dlg.addEventListener("click",e=>{ if(e.target===dlg) closeDlg(); });

/* ---------- タブ ---------- */
function showTab(t){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  ["match","score","set"].forEach(k=>$("pane-"+k).classList.toggle("on",k===t));
  document.body.classList.toggle("darkmode", t==="score");
  if(t==="score") renderBoard();
  window.scrollTo(0,0);
}
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) showTab(b.dataset.tab); });

/* ---------- 得点板 ---------- */
const bd={L:0,R:1,sc:{L:0,R:0}};
function fillSelects(){
  const T=teams();
  if(bd.L>=T.length) bd.L=0;
  if(bd.R>=T.length) bd.R=Math.min(1,T.length-1);
  ["L","R"].forEach(k=>{
    $("sel"+k).innerHTML=T.map((t,i)=>`<option value="${i}" ${bd[k]===i?"selected":""}>${esc(t)}</option>`).join("");
  });
}
function renderBoard(){
  fillSelects();
  const T=teams();
  $("nameL").textContent=T[bd.L]; $("nameR").textContent=T[bd.R];
  $("ptsL").textContent=bd.sc.L; $("ptsR").textContent=bd.sc.R;
  const same=bd.L===bd.R, r=same?null:get(bd.L,bd.R);
  $("bSave").disabled=same;
  $("bSave").textContent = r&&r.m ? "結果を記録しなおす" : "結果を記録";
  $("bNote").textContent = same ? "ちがうチームを2つ選ぶと、結果を記録できます" : "数字をタップしても＋1になります";
}
function addPt(k,dl){ bd.sc[k]=Math.max(0,bd.sc[k]+dl); renderBoard(); }
$("ptsL").onclick=()=>addPt("L",1); $("ptsR").onclick=()=>addPt("R",1);
$("sideL").querySelector(".pm").onclick=e=>{ const b=e.target.closest("button"); if(b) addPt("L",+b.dataset.d); };
$("sideR").querySelector(".pm").onclick=e=>{ const b=e.target.closest("button"); if(b) addPt("R",+b.dataset.d); };
$("selL").onchange=e=>{ bd.L=+e.target.value; renderBoard(); };
$("selR").onchange=e=>{ bd.R=+e.target.value; renderBoard(); };
$("bSwap").onclick=()=>{ [bd.L,bd.R]=[bd.R,bd.L]; [bd.sc.L,bd.sc.R]=[bd.sc.R,bd.sc.L]; renderBoard(); };
$("bZero").onclick=()=>{ bd.sc={L:0,R:0}; renderBoard(); };
function recordBoard(){
  const a=bd.sc.L, b=bd.sc.R, m=a>b?"○":a<b?"✖︎":"△", T=teams();
  put(bd.L,bd.R,a,b,m);
  renderAll(); renderBoard();
  $("bNote").textContent=`記録しました：${T[bd.L]} ${a}-${b} ${T[bd.R]}`;
}
$("bSave").onclick=()=>{
  if(bd.L===bd.R) return;
  const T=teams(), r=get(bd.L,bd.R);
  if(r&&r.m) ask(`${T[bd.L]} 対 ${T[bd.R]} はもう結果が入っています（${fmt(r.my,r.op)||r.m}）。${bd.sc.L}-${bd.sc.R} に書きかえますか？`, recordBoard);
  else recordBoard();
};

/* ---------- タイマー ---------- */
const timer={total:300, left:300, running:false, endAt:0, id:null, beeped:false};
function setTimerFromInputs(){
  const m=clamp(parseInt($("tMin").value)||0,0,99), s=clamp(parseInt($("tSec").value)||0,0,59);
  timer.total=m*60+s;
}
function resetTimer(){
  stopTick();
  $("tMin").value = store.minutes; $("tSec").value = 0;
  setTimerFromInputs(); timer.left=timer.total; timer.running=false; timer.beeped=false;
  showTimer();
}
function showTimer(){
  const t=Math.max(0,Math.ceil(timer.left)), m=Math.floor(t/60), s=t%60;
  const el=$("tDisp");
  el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  el.className = timer.left<=0 && timer.total>0 ? "end" : (timer.left<=10 && timer.running ? "low" : "");
  $("tStart").textContent = timer.running ? "一時停止" : (timer.left<timer.total && timer.left>0 ? "再開" : "スタート");
  $("tStart").className = "bbtn " + (timer.running ? "y" : "go");
}
function stopTick(){ if(timer.id){ clearInterval(timer.id); timer.id=null; } }
function tick(){
  timer.left=(timer.endAt-Date.now())/1000;
  if(timer.left<=0){ timer.left=0; timer.running=false; stopTick(); if(!timer.beeped){ timer.beeped=true; buzzer(); } }
  showTimer();
}
$("tStart").onclick=()=>{
  unlockAudio();
  if(timer.running){ timer.left=(timer.endAt-Date.now())/1000; timer.running=false; stopTick(); showTimer(); return; }
  if(timer.left<=0){ setTimerFromInputs(); timer.left=timer.total; timer.beeped=false; }
  if(timer.left<=0) return;
  timer.endAt=Date.now()+timer.left*1000; timer.running=true;
  stopTick(); timer.id=setInterval(tick,200); showTimer();
};
$("presets").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||timer.running) return; $("tMin").value=b.dataset.m; $("tSec").value=0; setTimerFromInputs(); timer.left=timer.total; timer.beeped=false; showTimer(); });
$("tReset").onclick=()=>{ stopTick(); setTimerFromInputs(); timer.left=timer.total; timer.running=false; timer.beeped=false; showTimer(); };
["tMin","tSec"].forEach(id=>$(id).addEventListener("change",()=>{ if(!timer.running){ setTimerFromInputs(); timer.left=timer.total; timer.beeped=false; showTimer(); } }));

let actx=null;
function unlockAudio(){
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){}
}
function buzzer(){
  try{
    unlockAudio(); if(!actx) return;
    const t0=actx.currentTime;
    [0,0.5,1.0].forEach(d=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="square"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.02);
      g.gain.setValueAtTime(0.35,t0+d+0.38); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.42);
      o.connect(g).connect(actx.destination); o.start(t0+d); o.stop(t0+d+0.45);
    });
  }catch(e){}
}

/* ---------- 設定 ---------- */
let draft=null; // {n,c,names}
function d(){ if(!draft) draft={n:N(), c:C(), names:store.allTeams.slice()}; return draft; }
function removedResults(n){ return Object.keys(store.res).filter(k=>k.split("-").some(x=>Number(x)>=n)).length; }
function renderSettingsForm(){
  const n = draft?draft.n:N(), c = draft?draft.c:C(), names = draft?draft.names:store.allTeams;
  $("nView").textContent=n; $("cView").textContent=c;
  $("nMinus").disabled=n<=MIN_T; $("nPlus").disabled=n>=MAX_T;
  $("cMinus").disabled=c<=MIN_C; $("cPlus").disabled=c>=MAX_C;
  $("teamInputs").innerHTML = names.slice(0,n).map((t,i)=>
    `<div><label>チーム${i+1}</label><input type="text" data-t="${i}" value="${esc(t)}"></div>`).join("");
  const lost=removedResults(n);
  $("setNote").textContent = draft ? (lost ? `チーム数を減らすと、外れるチームの試合結果（${lost}試合）は消えます。` : "「設定を保存」を押すと反映されます。") : "";
}
function loadSettingsForm(){
  draft=null;
  $("title").value=store.title; $("minIn").value=store.minutes;
  pWin.value=store.pts.win; pDraw.value=store.pts.draw; pLose.value=store.pts.lose;
  renderSettingsForm();
}
$("nMinus").onclick=()=>{ d().n=clamp(d().n-1,MIN_T,MAX_T); renderSettingsForm(); };
$("nPlus").onclick =()=>{ d().n=clamp(d().n+1,MIN_T,MAX_T); renderSettingsForm(); };
$("cMinus").onclick=()=>{ d().c=clamp(d().c-1,MIN_C,MAX_C); renderSettingsForm(); };
$("cPlus").onclick =()=>{ d().c=clamp(d().c+1,MIN_C,MAX_C); renderSettingsForm(); };
$("teamInputs").addEventListener("input",e=>{ const i=e.target.dataset.t; if(i==null) return; d().names[i]=e.target.value; $("setNote").textContent = removedResults(d().n) ? $("setNote").textContent : "「設定を保存」を押すと反映されます。"; });
["title","minIn","pWin","pDraw","pLose"].forEach(id=>$(id).addEventListener("input",()=>{ d(); if(!$("setNote").textContent) $("setNote").textContent="「設定を保存」を押すと反映されます。"; }));

function doSaveSettings(){
  const dr=d();
  const oldKey=N()+"-"+C();
  store.title=$("title").value.trim()||"リーグ戦 対戦表";
  store.n=dr.n; store.courts=dr.c;
  store.minutes=clamp(parseInt($("minIn").value)||0,0,99);
  store.pts={win:Number(pWin.value)||0, draw:Number(pDraw.value)||0, lose:Number(pLose.value)||0};
  dr.names.forEach((t,i)=>{ store.allTeams[i]=String(t).trim()||`チーム${i+1}`; });
  Object.keys(store.res).forEach(k=>{ if(k.split("-").some(x=>Number(x)>=store.n)) delete store.res[k]; });
  if(oldKey!==N()+"-"+C()) store.cur=null;
  persist(); loadSettingsForm(); renderAll(); renderBoard(); if(!timer.running) resetTimer(); setStatus("設定を保存しました");
}
let cfmAction=null;
function ask(text, action){ $("cfmText").textContent=text; cfmAction=action; $("cfm").classList.add("open"); }
$("cNo").onclick=()=>{ $("cfm").classList.remove("open"); cfmAction=null; };
$("cYes").onclick=()=>{ $("cfm").classList.remove("open"); const a=cfmAction; cfmAction=null; if(a) a(); };
$("saveSettings").onclick=()=>{
  const lost=removedResults(d().n);
  if(lost) ask(`チーム数を${d().n}にします。外れるチームの試合結果（${lost}試合）は消えて、元に戻せません。よろしいですか？`, doSaveSettings);
  else doSaveSettings();
};
$("resetBtn").onclick=()=>ask("すべての試合結果を消します。チーム名やコート数などの設定は残ります。よろしいですか？",()=>{
  store.res={}; store.cur=null; persist(); renderAll(); setStatus("結果をすべて消しました");
});
$("copyBtn").onclick=async()=>{
  const T=teams(), lines=[store.title,""];
  schedule().forEach((slot,s)=>{
    lines.push(`${s+1}回戦　` + slot.games.map(([a,b],k)=>{ const r=get(a,b);
      return `${COURT[k]}コート ${T[a]}` + (r&&r.m ? ` ${fmt(r.my,r.op)||r.m} ` : " - ") + T[b]; }).join("　／　")
      + (slot.rest.length?`　（休み：${slot.rest.map(t=>T[t]).join("、")}）`:""));
  });
  lines.push("","【順位】"); stats().forEach(r=>lines.push(`${r.rank}位 ${r.name}　勝点${r.pts}（${r.w}勝${r.d}分${r.l}敗・得失点差${r.diff>0?'+':''}${r.diff}）`));
  try{ await navigator.clipboard.writeText(lines.join("\n")); $("copyNote").textContent="コピーしました。"; }
  catch(e){ $("copyNote").textContent="コピーできませんでした。"; }
};
$("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(Object.assign({app:"league-taisenhyo",version:3},store),null,2)],{type:"application/json"});
  const a=document.createElement("a"), dt=new Date(), p=x=>String(x).padStart(2,"0");
  a.href=URL.createObjectURL(blob);
  a.download=`${(store.title||"対戦表").replace(/[\\/:*?"<>|]/g,"")}_${dt.getFullYear()}${p(dt.getMonth()+1)}${p(dt.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  setStatus("データを書き出しました");
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const x=JSON.parse(rd.result);
      if(!x||!Array.isArray(x.allTeams)||typeof x.res!=="object") throw new Error();
      ask("今の内容を、読み込んだデータで置きかえます。よろしいですか？",()=>{
        const base=defaultStore();
        store=Object.assign(base,{title:x.title||base.title, n:x.n||6, courts:x.courts||base.courts, minutes:x.minutes!=null?x.minutes:base.minutes,
          allTeams:x.allTeams.concat(base.allTeams.slice(x.allTeams.length)).slice(0,MAX_T), pts:x.pts||base.pts, res:x.res, cur:null});
        persist(); loadSettingsForm(); renderAll(); setStatus("データを読み込みました");
      });
    }catch(err){ setStatus("このファイルは読み込めませんでした", true); }
    e.target.value="";
  };
  rd.readAsText(f);
};

loadSettingsForm(); renderAll(); resetTimer();
</script>
